<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14283c"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>株トレード防衛</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#14283c;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:550px;margin:auto;padding:18px 14px 40px}header{background:#14283c;color:white;padding:20px 16px;padding-top:max(20px,env(safe-area-inset-top));}header div{max-width:520px;margin:auto}h1{font-size:23px;margin:0}small{color:#65778a}header small{color:#bccecc}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:16px}button{font:inherit;border:0;border-radius:10px;padding:12px 4px;background:#dce4ec;color:#14283c;cursor:pointer}button.active,button.primary{background:#146c60;color:white}section{background:white;border-radius:16px;padding:16px;margin-bottom:14px}h2{font-size:19px;margin:0 0 15px}label{display:block;font-size:14px;margin:13px 0 5px}input,select{width:100%;font:inherit;padding:12px;border:1px solid #bdcbd7;border-radius:8px;background:white;color:#14283c} .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{margin-top:16px;background:#edf5f3;border-radius:10px;padding:14px}.metric{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #d4e2df}.metric:last-child{border:0}.metric b{text-align:right}.hero{font-size:27px;color:#146c60}.warn{color:#a12626;font-weight:bold}.note{font-size:13px;line-height:1.6;color:#53677a} [hidden]{display:none!important}
</style></head><body><header><div><h1>株トレード防衛</h1><small>TRADE RISK MANAGER / 0.1.0</small></div></header><main><nav aria-label="機能"> <button data-tab="position" class="active">建玉計算</button><button data-tab="add">ナンピン</button><button data-tab="gap">急落試算</button><button data-tab="settings">設定</button></nav><section id="position"><h2>建玉リスク計算</h2><label>売買方向</label><select id="direction"><option value="buy">信用買い・現物買い</option><option value="sell">信用売り</option></select><label>購入・新規建価格（円）</label><input id="price" type="number" inputmode="decimal" placeholder="例：3000"><label>損切り指定方法</label><select id="stopmode"><option value="price">価格で指定</option><option value="percent">率で指定（%）</option></select><div class="pair"><div><label id="stoplabel">損切り価格（円）</label><input id="stop" type="number" inputmode="decimal"></div><div><label>利確価格（円）</label><input id="target" type="number" inputmode="decimal"></div></div><label>実際に予定する株数（任意）</label><input id="planned" type="number" inputmode="numeric"><div id="positionResult" class="result" aria-live="polite"></div><p class="note">表示株数は損失予算から算出した上限であり、買付余力・信用余力を保証しません。</p></section><section id="add" hidden><h2>ナンピン・追加建玉</h2><label>売買方向</label><select id="adirection"><option value="buy">買い</option><option value="sell">売り</option></select><div class="pair"><div><label>現在の平均価格</label><input id="ap" type="number"></div><div><label>現在の株数</label><input id="aq" type="number"></div><div><label>追加価格</label><input id="bp" type="number"></div><div><label>追加株数</label><input id="bq" type="number"></div></div><label>追加後の撤退価格</label><input id="astop" type="number"><div id="addResult" class="result" aria-live="polite"></div></section><section id="gap" hidden><h2>逆行・ギャップ試算</h2><label>売買方向</label><select id="gdirection"><option value="buy">買い（下落）</option><option value="sell">売り（上昇）</option></select><div class="pair"><div><label>基準価格（円）</label><input id="gp" type="number"></div><div><label>株数</label><input id="gq" type="number"></div></div><label>任意の逆行率（%）</label><input id="gg" type="number" value="10"><div id="gapResult" class="result" aria-live="polite"></div><p class="note">基準価格からの変動損失。取得価格を入力すれば取得時点からの損失になります。</p></section><section id="settings" hidden><h2>基本設定</h2><label>口座純資産（円）</label><input id="assets" type="number" inputmode="numeric" placeholder="入力してください"><label>1R設定方法</label><select id="budgetmode"><option value="percent">純資産に対する割合</option><option value="yen">金額で指定</option></select><label id="budgetlabel">1R（%）</label><input id="risk" type="number" value="0.5" step="any"><label>売買単位（株）</label><input id="unit" type="number" value="100"><p class="note">0.5%は変更可能な仮の初期値です。設定はこの端末のブラウザに保存されます。</p><button id="clear">保存データを消去</button><p id="storage" class="note"></p></section><p class="note">手数料・金利・逆日歩・税金・スリッページは未反映。逆指値の約定価格は保証されません。個人データは外部送信しません。</p></main><script src="risk.js"></script><script src="app.js"></script></body></html>
